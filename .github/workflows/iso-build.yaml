name: Build pearOS ISO

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "pear/**"
      - "packages/**"
      - "gh-actions/**"
      - "build-binary"
      - "kickstart.sh"
      - ".github/workflows/iso-build.yaml"
  schedule:
    # Every Wednesday 03:00 UTC. The "second Wednesday of the month" part is
    # enforced by the `gate` job below, not here: when both day-of-month and
    # day-of-week are restricted, cron matches on EITHER, so '0 3 8-14 * 3'
    # fired on days 8-14 *plus* every Wednesday.
    - cron: '0 3 * * 3'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to R2 and update sha.txt (untick to build + test only; the ISO is kept as an artifact)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Turns the weekly cron into "second Wednesday of the month". Only scheduled
  # runs are gated -- push and workflow_dispatch always build.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event is ${{ github.event_name }}, not gating."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The cron already restricted this to a Wednesday; the second one of
          # any month is always between the 8th and the 14th inclusive.
          dom=$(date -u +%-d)
          if [ "$dom" -ge 8 ] && [ "$dom" -le 14 ]; then
            echo "Day $dom -- second Wednesday, building."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Day $dom -- not the second Wednesday, skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  build-iso:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checking out source code
        uses: actions/checkout@v4

      - name: Setup custom pacman.conf + mirrorlist
        run: |
          echo "Copying pacman.conf and mirrorlist from gh-actions/ (mirrors the pearOS build machine)..."
          cp gh-actions/pacman.conf /etc/pacman.conf
          cp gh-actions/mirrorlist /etc/pacman.d/mirrorlist

      - name: Init pacman keyring
        run: |
          pacman-key --init
          pacman-key --populate archlinux

          pacman-key -a packages/pearos.gpg
          pacman-key --lsign-key 4C1A9F3C131ACA95

          pacman-key -a packages/inled.gpg
          pacman-key --lsign-key 89F828A9675B63CD0077CE9965AA57CF36E2018F

          # [cachyos] supplies the kernel, chwd, mkinitcpio-openswap and the
          # legacy NVIDIA branches. mkarchiso/pacstrap verifies those against
          # the *container's* keyring, so the key has to be here -- shipping
          # cachyos-keyring inside the ISO only covers the installed system.
          #
          # The keyring package is republished in our own repo and signed with
          # our key, which is already trusted two lines up. So it installs
          # through the normal verified path; the previous Manjaro bootstrap
          # had to blank out LocalFileSigLevel/RemoteFileSigLevel to get its
          # keyring in, which meant one unverified package download per build.
          awk '/^\[cachyos\]/{skip=1; next} /^\[/{skip=0} !skip' /etc/pacman.conf \
            > /tmp/pacman-bootstrap.conf
          pacman -Sy --noconfirm --config /tmp/pacman-bootstrap.conf
          pacman -S --noconfirm --config /tmp/pacman-bootstrap.conf cachyos-keyring
          pacman-key --populate cachyos
          pacman -Sy --noconfirm

      - name: Updating packages and installing deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            archiso \
            arch-install-scripts \
            mtools \
            dosfstools \
            squashfs-tools \
            xorriso \
            e2fsprogs \
            git \
            pv \
            rclone

      - name: Starting Build
        run: |
          chmod +x ./kickstart.sh
          ./kickstart.sh

      - name: Keep the ISO for the test job
        uses: actions/upload-artifact@v4
        with:
          name: iso-under-test
          path: |
            out/*.iso
            *.iso
            sha.txt
          retention-days: 1
          compression-level: 0

  # Boots the ISO, installs it onto a virtual disk, boots the installed system,
  # uses it, and only then publishes. Runs on the plain runner (not the Arch
  # container) because it needs KVM and ~10 GB of free disk for the target.
  test-and-publish:
    needs: build-iso
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checking out source code
        uses: actions/checkout@v4

      - name: Free disk space (the installed test system needs ~10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install QEMU, OVMF, OCR, rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf rclone tesseract-ocr ffmpeg
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true; nproc; free -g | sed -n 2p

      - name: Download the ISO
        uses: actions/download-artifact@v4
        with:
          name: iso-under-test

      - name: Boot test + end-to-end install + usability (QEMU)
        id: boottest
        # Never abort here: a failed test must still upload its screenshots,
        # write the reason into README.md and quarantine the ISO (see below).
        # The run is failed explicitly by the last step.
        continue-on-error: true
        run: |
          ISO_FILE=$(find . -maxdepth 2 -name "*.iso" | head -n 1)
          if [ -w /dev/kvm ]; then
            # Install onto a 20 GB virtual disk, boot it, log in, run Konsole,
            # pacman -Syyu and a few apps. Needs KVM (about 25 min).
            extra="--full-install --disk-dir $RUNNER_TEMP/target-disk --install-timeout 3600 --duration 240"
          else
            echo "::warning::No /dev/kvm on this runner: skipping the end-to-end install."
            extra="--duration 600"
          fi
          python3 tests/boot-test.py "$ISO_FILE" --interval 10 --memory 8G $extra

      - name: Upload boot screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-sequence
          path: seq/

      - name: Configure rclone (R2)
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          mkdir -p "${HOME}/.config/rclone"
          cat > "${HOME}/.config/rclone/rclone.conf" <<EOF
          [r2-pearos]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT_URL}
          acl = private
          EOF

      - name: Quarantine the ISO if the boot test failed (not published)
        if: steps.boottest.outcome == 'failure' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        run: |
          ISO_FILE=$(find . -maxdepth 2 -name "*.iso" | head -n 1)
          NAME="$(basename "$ISO_FILE" .iso)-FAIL_TEST.iso"
          echo "Boot test FAILED. Saving $ISO_FILE as failed/$NAME (the public iso/ folder is untouched)."
          rclone copyto "$ISO_FILE" "r2-pearos:pearos-cdn/failed/$NAME" --progress

      - name: Uploading to R2 (pearos-cdn/iso)
        if: steps.boottest.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        run: |
          ISO_FILE=$(find . -maxdepth 2 -name "*.iso" | head -n 1)

          if [ -z "$ISO_FILE" ]; then
            echo "[ ERR ]: Could not find ISO file."
            exit 1
          fi

          echo "Uploading $ISO_FILE (file-size: $(du -h "$ISO_FILE" | cut -f1)) to Cloudflare R2 (pearos-cdn/iso)..."

          rclone copy "$ISO_FILE" "r2-pearos:pearos-cdn/iso/" --progress

          if [ -f sha.txt ]; then
            SHA_FILE="$(basename "$ISO_FILE").sha256"
            cp sha.txt "$SHA_FILE"

            echo "Uploading $SHA_FILE to Cloudflare R2 (pearos-cdn/iso)..."

            rclone copy "$SHA_FILE" "r2-pearos:pearos-cdn/iso/" --progress
          else
            echo "[ ERR ]: sha.txt not found, skipping checksum upload."
          fi

          echo "[ SUCCESS ] Upload finished"

      - name: Commit boot status (and sha.txt when the ISO was published)
        if: always() && steps.boottest.outcome != 'skipped' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          BOOT_OUTCOME: ${{ steps.boottest.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # $GITHUB_WORKSPACE/.git is gone by this point (something in the
          # mkarchiso/pacstrap process wipes or obscures it) -- clone fresh
          # into a separate dir instead of depending on the build workspace's
          # own repo state.
          new_sha=$(cat "$GITHUB_WORKSPACE/sha.txt")

          clonedir=$(mktemp -d)
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$clonedir"

          cd "$clonedir"
          # A failed (quarantined) ISO must not move sha.txt.
          [ "$BOOT_OUTCOME" = "success" ] && echo "$new_sha" > sha.txt

          git config user.name "pearOS build bot"
          git config user.email "actions@users.noreply.github.com"

          # Boot-test screenshots + the README section listing them.
          rm -rf seq
          [ -d "$GITHUB_WORKSPACE/seq" ] && cp -r "$GITHUB_WORKSPACE/seq" seq
          # Web-sized copies (960px webp, ~25 KB each) for the NiceC0re page gallery.
          if [ -d seq ]; then
            mkdir -p seq/web
            for f in seq/[0-9]*.png; do
              ffmpeg -loglevel error -y -i "$f" -vf scale=960:-1 -quality 70 \
                "seq/web/$(basename "${f%.png}").webp" || true
            done
          fi
          [ -f "$GITHUB_WORKSPACE/README.md" ] && cp "$GITHUB_WORKSPACE/README.md" README.md

          git add -A sha.txt seq README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          iso_name="$(basename "$(find "$GITHUB_WORKSPACE" -maxdepth 2 -name "*.iso" | head -n1)")"
          if [ "$BOOT_OUTCOME" = "success" ]; then
            git commit -m "Update sha.txt for $iso_name"
          else
            git commit -m "Boot test FAILED for $iso_name: see README (Boot Status sequence)"
          fi
          git push origin "${GITHUB_REF_NAME}"

      - name: Refresh the website (sha, size, download table)
        # The site syncs sha.txt in its own repo once a day; kick that off now
        # that a new ISO is live. Needs a token that may run workflows in
        # Pear-Project/web (secret WEB_REPO_PAT); without it this is skipped
        # and the daily sync picks the new sha up.
        if: steps.boottest.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WEB_REPO_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::WEB_REPO_PAT is not set for this repo; the site will pick up the new sha at its next daily sync."
            exit 0
          fi
          gh workflow run update-sha.yml -R Pear-Project/web --ref main
          echo "Triggered Pear-Project/web update-sha.yml"

      - name: Fail the run if the boot test failed
        if: always() && steps.boottest.outcome == 'failure'
        run: |
          echo "::error::Boot test failed - the ISO was NOT published. See the README 'Boot Status sequence' for the reason."
          exit 1
