name: Build pearOS ISO

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 3 8-14 * 3'
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checking out source code
        uses: actions/checkout@v4

      - name: Setup custom pacman.conf + mirrorlist
        run: |
          echo "Copying pacman.conf and mirrorlist from gh-actions/ (mirrors the pearOS build machine)..."
          cp gh-actions/pacman.conf /etc/pacman.conf
          cp gh-actions/mirrorlist /etc/pacman.d/mirrorlist

      - name: Init pacman keyring
        run: |
          pacman-key --init
          pacman-key --populate archlinux

          # Bootstrap manjaro-keyring: [core]/[extra] now resolve through the
          # Manjaro mirrorlist (same as the build machine), so some packages
          # (e.g. mkinitcpio-openswap, required by calamares) are signed by
          # Manjaro packager keys unknown to a stock archlinux-keyring.
          # Optional still validates a signature if one is present -- it just
          # allows a MISSING one -- so an untrusted-but-present signature
          # still fails. Drop to Never for this one bootstrap install only,
          # then restore, same trust-bootstrap problem every fresh Manjaro
          # install solves by shipping the keyring pre-baked in the ISO.
          sed -i 's/^LocalFileSigLevel.*/LocalFileSigLevel = Never/;s/^#\?RemoteFileSigLevel.*/RemoteFileSigLevel = Never/' /etc/pacman.conf
          pacman -U --noconfirm \
            "https://mirror1.sox.rs/manjaro/testing/core/x86_64/manjaro-keyring-20251003-1-any.pkg.tar.zst"
          sed -i 's/^LocalFileSigLevel.*/LocalFileSigLevel = Optional/;s/^RemoteFileSigLevel.*/#RemoteFileSigLevel = Required/' /etc/pacman.conf
          pacman-key --populate manjaro

          pacman-key -a packages/pearos.gpg
          pacman-key --lsign-key 4C1A9F3C131ACA95

          pacman-key -a packages/inled.gpg
          pacman-key --lsign-key 89F828A9675B63CD0077CE9965AA57CF36E2018F

      - name: Updating packages and installing deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            archiso \
            arch-install-scripts \
            mtools \
            dosfstools \
            squashfs-tools \
            xorriso \
            e2fsprogs \
            git \
            pv \
            aws-cli

      - name: Starting Build
        run: |
          chmod +x ./kickstart.sh
          ./kickstart.sh

      - name: Conf AWS CLI for Cloudflare R2
        run: |
          aws configure set default.s3.multipart_chunksize 64MB
          aws configure set default.s3.max_concurrent_requests 10

      - name: Uploading to R2 Bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          ISO_FILE=$(ls out/*.iso 2>/dev/null || ls *.iso 2>/dev/null | head -n 1)
          
          if [ -z "$ISO_FILE" ]; then
            echo "[ ERR ]: Could not find ISO file."
            exit 1
          fi

          echo "Uploading $ISO_FILE (dimensiune: $(du -h "$ISO_FILE" | cut -f1)) in Cloudflare R2..."
          
          aws s3 cp "$ISO_FILE" "s3://$BUCKET_NAME/$(basename "$ISO_FILE")" \
            --endpoint-url "$ENDPOINT_URL" \
            --region auto \
            --no-progress

          if [ -f sha.txt ]; then
            SHA_FILE="$(basename "$ISO_FILE").sha256"
            cp sha.txt "$SHA_FILE"

            echo "Uploading $SHA_FILE in Cloudflare R2..."

            aws s3 cp "$SHA_FILE" "s3://$BUCKET_NAME/$SHA_FILE" \
              --endpoint-url "$ENDPOINT_URL" \
              --region auto \
              --no-progress
          else
            echo "[ ERR ]: sha.txt not found, skipping checksum upload."
          fi

          echo "[ SUCCESS ] Upload finished"
