name: Build pearOS ISO

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "pear/**"
      - "packages/**"
      - "gh-actions/**"
      - "build-binary"
      - "kickstart.sh"
      - ".github/workflows/iso-build.yaml"
  schedule:
    # Every Wednesday 03:00 UTC. The "second Wednesday of the month" part is
    # enforced by the `gate` job below, not here: when both day-of-month and
    # day-of-week are restricted, cron matches on EITHER, so '0 3 8-14 * 3'
    # fired on days 8-14 *plus* every Wednesday.
    - cron: '0 3 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Turns the weekly cron into "second Wednesday of the month". Only scheduled
  # runs are gated -- push and workflow_dispatch always build.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event is ${{ github.event_name }}, not gating."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The cron already restricted this to a Wednesday; the second one of
          # any month is always between the 8th and the 14th inclusive.
          dom=$(date -u +%-d)
          if [ "$dom" -ge 8 ] && [ "$dom" -le 14 ]; then
            echo "Day $dom -- second Wednesday, building."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Day $dom -- not the second Wednesday, skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  build-iso:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checking out source code
        uses: actions/checkout@v4

      - name: Setup custom pacman.conf + mirrorlist
        run: |
          echo "Copying pacman.conf and mirrorlist from gh-actions/ (mirrors the pearOS build machine)..."
          cp gh-actions/pacman.conf /etc/pacman.conf
          cp gh-actions/mirrorlist /etc/pacman.d/mirrorlist

      - name: Init pacman keyring
        run: |
          pacman-key --init
          pacman-key --populate archlinux

          pacman-key -a packages/pearos.gpg
          pacman-key --lsign-key 4C1A9F3C131ACA95

          pacman-key -a packages/inled.gpg
          pacman-key --lsign-key 89F828A9675B63CD0077CE9965AA57CF36E2018F

          # [cachyos] supplies the kernel, chwd, mkinitcpio-openswap and the
          # legacy NVIDIA branches. mkarchiso/pacstrap verifies those against
          # the *container's* keyring, so the key has to be here -- shipping
          # cachyos-keyring inside the ISO only covers the installed system.
          #
          # The keyring package is republished in our own repo and signed with
          # our key, which is already trusted two lines up. So it installs
          # through the normal verified path; the previous Manjaro bootstrap
          # had to blank out LocalFileSigLevel/RemoteFileSigLevel to get its
          # keyring in, which meant one unverified package download per build.
          awk '/^\[cachyos\]/{skip=1; next} /^\[/{skip=0} !skip' /etc/pacman.conf \
            > /tmp/pacman-bootstrap.conf
          pacman -Sy --noconfirm --config /tmp/pacman-bootstrap.conf
          pacman -S --noconfirm --config /tmp/pacman-bootstrap.conf cachyos-keyring
          pacman-key --populate cachyos
          pacman -Sy --noconfirm

      - name: Updating packages and installing deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            archiso \
            arch-install-scripts \
            mtools \
            dosfstools \
            squashfs-tools \
            xorriso \
            e2fsprogs \
            git \
            pv \
            rclone

      - name: Starting Build
        run: |
          chmod +x ./kickstart.sh
          ./kickstart.sh

      - name: Configure rclone (R2)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          mkdir -p "${HOME}/.config/rclone"
          cat > "${HOME}/.config/rclone/rclone.conf" <<EOF
          [r2-pearos]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT_URL}
          acl = private
          EOF

      - name: Uploading to R2 (pearos-cdn/iso)
        run: |
          ISO_FILE=$(ls out/*.iso 2>/dev/null || ls *.iso 2>/dev/null | head -n 1)

          if [ -z "$ISO_FILE" ]; then
            echo "[ ERR ]: Could not find ISO file."
            exit 1
          fi

          echo "Uploading $ISO_FILE (file-size: $(du -h "$ISO_FILE" | cut -f1)) to Cloudflare R2 (pearos-cdn/iso)..."

          rclone copy "$ISO_FILE" "r2-pearos:pearos-cdn/iso/" --progress

          if [ -f sha.txt ]; then
            SHA_FILE="$(basename "$ISO_FILE").sha256"
            cp sha.txt "$SHA_FILE"

            echo "Uploading $SHA_FILE to Cloudflare R2 (pearos-cdn/iso)..."

            rclone copy "$SHA_FILE" "r2-pearos:pearos-cdn/iso/" --progress
          else
            echo "[ ERR ]: sha.txt not found, skipping checksum upload."
          fi

          echo "[ SUCCESS ] Upload finished"

      - name: Commit updated sha.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # $GITHUB_WORKSPACE/.git is gone by this point (something in the
          # mkarchiso/pacstrap process wipes or obscures it) -- clone fresh
          # into a separate dir instead of depending on the build workspace's
          # own repo state.
          new_sha=$(cat "$GITHUB_WORKSPACE/sha.txt")

          clonedir=$(mktemp -d)
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$clonedir"

          cd "$clonedir"
          echo "$new_sha" > sha.txt

          git config user.name "pearOS build bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet -- sha.txt; then
            echo "sha.txt unchanged, nothing to commit."
            exit 0
          fi

          git add sha.txt
          git commit -m "Update sha.txt for $(basename "$(ls "$GITHUB_WORKSPACE"/*.iso 2>/dev/null | head -n1)")"
          git push origin "${GITHUB_REF_NAME}"
