# GPU driver selection is no longer done from the boot menu: nvidia-module-loader
# asks chwd what the GPU is and loads nouveau or the open nvidia modules itself.
# Never blacklist nouveau here -- on a pre-Turing GPU the open nvidia module
# refuses to load and the machine would be left with no driver at all.
#
# Labels are single words on purpose: archiso_sys.cfg says `DEFAULT arch64`,
# which never matched the old space-separated labels.

LABEL arch64
TEXT HELP
Boot the pearOS installer on BIOS.
GPU drivers are detected automatically.
ENDTEXT
MENU LABEL pearOS installer (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G module_blacklist=pcspkr i915.modeset=1 amdgpu.modeset=1 radeon.modeset=1 nvme_load=yes quiet splash

LABEL arch64-noplymouth
TEXT HELP
Boot the pearOS installer on BIOS without Plymouth.
Use this option if Plymouth freezes or crashes during boot.
ENDTEXT
MENU LABEL pearOS installer (x86_64, BIOS), No Plymouth (Debug)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G module_blacklist=pcspkr i915.modeset=1 amdgpu.modeset=1 radeon.modeset=1 nvme_load=yes plymouth.ignore-serial-consoles

LABEL arch64-legacy
TEXT HELP
Boot the pearOS installer on BIOS with kernel modesetting disabled.
Use this option if the screen stays black or the GPU is very old.
ENDTEXT
MENU LABEL pearOS installer (x86_64, BIOS), Legacy Hardware (GPU nomodeset)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G module_blacklist=nvidia,nvidia_modeset,nvidia_uvm,nvidia_drm nomodeset nvme_load=yes
