#
# /etc/pacman.conf
#
# See the pacman.conf(5) manpage for option and repository directives
#
# SPDX-License-Identifier: GPL-3.0-or-later

#
# GENERAL OPTIONS
#
[options]
# The following paths are commented out with their default values listed.
# If you wish to use different paths, uncomment and update the paths.
#RootDir     = /
#DBPath      = /var/lib/pacman/
# Cache dedicat build-ului, NU cel al hostului.
#
# Manjaro reconstruieste o parte din pachetele Arch pastrand exact acelasi
# nume de fisier: bash-5.3.15-1-x86_64.pkg.tar.zst, pacman-7.1.0.r9...,
# xorg-server-21.1.24-1, os-prober-1.84-1, inxi, lsb-release,
# gsettings-*-schemas, systemd*, grub, mkinitcpio-openswap.
#
# `pacstrap -c` foloseste cache-ul hostului. Pe o masina Manjaro, pacman
# gaseste fisierul deja acolo, il refoloseste dupa nume -- dar e build-ul
# Manjaro -- si apoi il verifica contra semnaturii Arch din baza de date.
# Rezultat: "signature from <arch packager> is invalid" pe fix pachetele pe
# care Manjaro le rebuild-uieste. Nimic nu e corupt; sunt doua pachete
# diferite cu acelasi nume.
#
# Un director separat pastreaza reutilizarea intre build-uri, fara amestec.
CacheDir = /var/cache/pearos-build/pkg/
#LogFile     = /var/log/pacman.log
#GPGDir      = /etc/pacman.d/gnupg/
#HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc
#XferCommand = /usr/bin/curl -L -C - -f -o %o %u
#XferCommand = /usr/bin/wget --passive-ftp -c -O %o %u
#CleanMethod = KeepInstalled
Architecture = auto

# Pacman won't upgrade packages listed in IgnorePkg and members of IgnoreGroup
IgnorePkg   = linux linux-headers
#IgnoreGroup =

#NoUpgrade   =
#NoExtract   =

# Misc options
#UseSyslog
Color
ParallelDownloads = 5
# We cannot check disk space from within a chroot environment
#CheckSpace
#VerbosePkgLists

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required

# NOTE: You must run `pacman-key --init` before first using pacman; the local
# keyring can then be populated with the keys of all official Arch Linux
# packagers with `pacman-key --populate archlinux`.

#
# REPOSITORIES
#   - can be defined here or included from another file
#   - pacman will search repositories in the order defined here
#   - local/custom mirrors can be added here or in separate files
#   - repositories listed first will take precedence when packages
#     have identical names, regardless of version number
#   - URLs will have $repo replaced by the name of the current repo
#   - URLs will have $arch replaced by the name of the architecture
#
# Repository entries are of the format:
#       [repo-name]
#       Server = ServerName
#       Include = IncludePath
#
# The header [repo-name] is crucial - it must be present and
# uncommented to enable the repo.
#

# The testing repositories are disabled by default. To enable, uncomment the
# repo name header and Include lines. You can add preferred servers immediately
# after the header, and they will be used before the default mirrors.

#[testing]
SigLevel = Required DatabaseOptional
#Include = /etc/pacman.d/mirrorlist

[pearos]
SigLevel = Required DatabaseOptional
Server = https://mirror.pearos.xyz/main/x86_64/

[inled]
SigLevel = Required DatabaseOptional
Server = https://apt.inled.es/arch/

# Server explicit, NU Include: `Include = /etc/pacman.d/mirrorlist` este o cale
# absoluta pe masina care ruleaza pacman, adica hostul de build -- nu in profil.
# Hostul e pearOS pe baza Manjaro, deci un Include ar trage pachete Manjaro
# intr-un ISO Arch. Lista de mai jos face build-ul autonom si reproductibil,
# inclusiv in gh-actions.
[core]
SigLevel = Required DatabaseOptional
Server = https://frankfurt.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.iusearchbtw.nl/$repo/os/$arch
Server = https://mirror.bethselamin.de/$repo/os/$arch
Server = https://mirrors.niyawe.de/archlinux/$repo/os/$arch
Server = https://mirror.ipb.de/archlinux/$repo/os/$arch

[extra]
SigLevel = Required DatabaseOptional
Server = https://frankfurt.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.iusearchbtw.nl/$repo/os/$arch
Server = https://mirror.bethselamin.de/$repo/os/$arch
Server = https://mirrors.niyawe.de/archlinux/$repo/os/$arch
Server = https://mirror.ipb.de/archlinux/$repo/os/$arch

# Strict sub [extra], si mereu sub [pearos]: pacman alege primul repo care
# contine numele, indiferent de versiune. Repo-ul CachyOS contine rebuild-uri de
# mesa, vulkan-*, pacman si linux-firmware -- deasupra lui [extra] ar umbri baza
# Arch. De aici luam doar ce nu exista in Arch: kernelele cachyos, chwd,
# zfs-utils, mkinitcpio-openswap si driverele nvidia legacy.
[cachyos]
SigLevel = Required DatabaseOptional
Server = https://mirror.cachyos.org/repo/$arch/$repo

#[community-testing]
SigLevel = Required DatabaseOptional
#Include = /etc/pacman.d/mirrorlist

#[community]
SigLevel = Required DatabaseOptional
#Include = /etc/pacman.d/mirrorlist

# If you want to run 32 bit applications on your x86_64 system,
# enable the multilib repositories as required here.

#[multilib-testing]
SigLevel = Required DatabaseOptional
#Include = /etc/pacman.d/mirrorlist

[multilib]
SigLevel = Required DatabaseOptional
Server = https://frankfurt.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.iusearchbtw.nl/$repo/os/$arch
Server = https://mirror.bethselamin.de/$repo/os/$arch
Server = https://mirrors.niyawe.de/archlinux/$repo/os/$arch
Server = https://mirror.ipb.de/archlinux/$repo/os/$arch

# An example of a custom package repository.  See the pacman manpage for
# tips on creating your own repositories.
#[custom]
#SigLevel = Optional TrustAll
#Server = file:///home/custompkgs

#[main]
#SigLevel = Optional TrustedOnly
#Server = http://192.168.1.6/$repo/$arch
